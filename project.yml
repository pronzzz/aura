name: Aura
options:
  bundleIdPrefix: com.pranavdwivedi
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "20"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  Aura:
    type: application
    platform: macOS
    sources:
      - path: Aura
    settings:
      base:
        PRODUCT_NAME: Aura
        PRODUCT_BUNDLE_IDENTIFIER: com.pranavdwivedi.aura
        INFOPLIST_FILE: Aura/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Aura/App/Aura.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Release:
          ONLY_ACTIVE_ARCH: NO
          SWIFT_OPTIMIZATION_LEVEL: "-O"

schemes:
  Aura:
    build:
      targets:
        Aura: all
    run:
      config: Debug
    archive:
      config: Release
